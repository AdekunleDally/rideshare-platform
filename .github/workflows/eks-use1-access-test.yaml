name: EKS use1 Access Test

on:
    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    eks-access-test:
        name: Test use1 EKS Access
        runs-on: ubuntu-latest

        environment:
            name: production-use1

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                  role-to-assume: arn:aws:iam::287872994236:role/rideshare-github-actions-use1-role
                  aws-region: us-east-1
                  allowed-account-ids: "287872994236"

            - name: Verify AWS identity
              run: aws sts get-caller-identity

            - name: Configure use1 kubeconfig
              run: |
                  aws eks update-kubeconfig \
                    --name rideshare-prod-use1 \
                    --region us-east-1

            - name: Verify target cluster
              run: |
                  kubectl config current-context

            - name: Verify Kubernetes authorization
              run: |
                  kubectl auth can-i get pods -n rideshare
                  kubectl auth can-i create deployments -n rideshare
                  kubectl auth can-i patch deployments -n rideshare

            - name: Inspect production workloads
              run: |
                  kubectl get deployments -n rideshare
                  kubectl get pods -n rideshare

            - name: Inspect Helm release
              run: helm list -n rideshare
