name: AWS OIDC Test

on:
    push:
        branches:
            - ci/add-aws-oidc-auth

    workflow_dispatch:

permissions:
    id-token: write
    contents: read

jobs:
    aws-authentication:
        name: Test AWS OIDC Authentication
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Inspect GitHub OIDC claims
              uses: actions/github-script@v7
              with:
                  script: |
                      const token = await core.getIDToken('sts.amazonaws.com')
                      const payload = JSON.parse(
                        Buffer.from(token.split('.')[1], 'base64url').toString()
                      )

                      console.log('aud:', payload.aud)
                      console.log('sub:', payload.sub)
                      console.log('repository:', payload.repository)
                      console.log('repository_id:', payload.repository_id)
                      console.log('repository_owner:', payload.repository_owner)
                      console.log('repository_owner_id:', payload.repository_owner_id)
                      console.log('ref:', payload.ref)

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6.2.3
              with:
                  role-to-assume: arn:aws:iam::287872994236:role/rideshare-github-actions-role
                  aws-region: us-east-1
                  allowed-account-ids: "287872994236"

            - name: Verify AWS identity
              run: aws sts get-caller-identity
