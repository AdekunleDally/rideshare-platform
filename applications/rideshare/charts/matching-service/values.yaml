# Default values for matching-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 2

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  #repository: 287872994236.dkr.ecr.us-east-1.amazonaws.com/rideshare/matching-service
  #repository: 495331822130.dkr.ecr.us-east-2.amazonaws.com/lukman-rideshare-matching-service
  # This sets the pull policy for images.
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

config:
  TRIP_SERVICE_URL: "http://trip-service:3005"

  # Redis (use service in redis namespace)
  # REDIS_HOST: "rideshare-redis-cluster-leader.redis.svc.cluster.local"
  REDIS_HOST: ""

  REDIS_PORT: "6379"
  REDIS_TLS: "false"

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

container:
  port: 3004
