apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rideshare-rds-admin
  namespace: database-migration
  labels:
    app.kubernetes.io/name: rideshare-rds-admin
    app.kubernetes.io/part-of: rideshare-platform
    app.kubernetes.io/managed-by: external-secrets

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rideshare-rds-admin
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

      data:
        username: "{{ .username }}"
        password: "{{ .password }}"

        host: "rideshare-prod-use1-postgres.cafwao08sxlo.us-east-1.rds.amazonaws.com"
        port: "5432"
        database: "rideshare"
        sslmode: "require"

  data:
    - secretKey: username
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:287872994236:secret:rds!db-402f2e5e-a0ea-481a-af70-f37e4cc286bb-O7mbJU
        property: username

    - secretKey: password
      remoteRef:
        key: arn:aws:secretsmanager:us-east-1:287872994236:secret:rds!db-402f2e5e-a0ea-481a-af70-f37e4cc286bb-O7mbJU
        property: password
