apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-validation
  namespace: rideshare
  labels:
    app.kubernetes.io/name: eso-validation
    app.kubernetes.io/part-of: rideshare-platform
    app.kubernetes.io/managed-by: external-secrets
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: eso-validation
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: username
      remoteRef:
        key: rideshare/production/test/eso-validation
        property: username

    - secretKey: password
      remoteRef:
        key: rideshare/production/test/eso-validation
        property: password

    - secretKey: environment
      remoteRef:
        key: rideshare/production/test/eso-validation
        property: environment
