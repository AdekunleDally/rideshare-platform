---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: driver-service-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: driver-service-secret
    app.kubernetes.io/part-of: rideshare
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: driver-service-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: rideshare/driver-service-secret

