apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: driver-service-es
  namespace: rideshare
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: driver-service-secret
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: rideshare/production/driver/credentials
        property: JWT_SECRET
