apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rideshare-db-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rideshare-db-credentials
    app.kubernetes.io/part-of: rideshare
    app.kubernetes.io/managed-by: {{ .Release.Service }}

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: rideshare-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

  dataFrom:
    - extract:
        key: rideshare/production/database/credentials