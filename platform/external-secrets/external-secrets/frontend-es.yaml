apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: frontend-es
  namespace: rideshare
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: frontend-secret
    creationPolicy: Owner
  data:
    - secretKey: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
      remoteRef:
        key: rideshare/frontend-secret
        property: NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN
