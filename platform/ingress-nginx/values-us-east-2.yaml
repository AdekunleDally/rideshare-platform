controller:
  replicaCount: 2

  ingressClass: nginx

  ingressClassResource:
    name: nginx
    enabled: true
    default: true
    controllerValue: k8s.io/ingress-nginx

  nodeSelector:
    workload-type: platform

  tolerations:
    - key: workload-type
      operator: Equal
      value: platform
      effect: NoSchedule

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - controller
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - ingress-nginx
          topologyKey: kubernetes.io/hostname

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  service:
    enabled: true
    type: LoadBalancer
    externalTrafficPolicy: Local

    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
      service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: "Project=rideshare,Environment=production,Region=us-east-2,RegionCode=use2,Owner=platform-engineering,Repository=rideshare-platform"

  publishService:
    enabled: true

  allowSnippetAnnotations: false

  config:
    use-forwarded-headers: "true"
    compute-full-forwarded-for: "true"
    enable-real-ip: "true"
    proxy-connect-timeout: "10"
    proxy-read-timeout: "60"
    proxy-send-timeout: "60"

  metrics:
    enabled: true

    service:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "10254"

  admissionWebhooks:
    enabled: true

    patch:
      nodeSelector:
        workload-type: platform

      tolerations:
        - key: workload-type
          operator: Equal
          value: platform
          effect: NoSchedule

  podDisruptionBudget:
    enabled: true
    minAvailable: 1

defaultBackend:
  enabled: false
