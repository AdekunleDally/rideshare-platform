apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-check
  namespace: rideshare
spec:
  replicas: 1
  selector:
    matchLabels:
      app: health-check
  template:
    metadata:
      labels:
        app: health-check
    spec:
      containers:
        - name: health-check
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: health-check-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: health-check
  namespace: rideshare
spec:
  selector:
    app: health-check
  ports:
    - port: 80
      targetPort: 80
